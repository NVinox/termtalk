[package]
name = "termtalk"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
futures-util = "0.3.34"
ratatui = "0.30.2"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
textwrap = "0.16.4"
